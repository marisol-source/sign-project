<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reconocimiento de Gestos</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex justify-center items-center h-screen text-white overflow-hidden">

  <!-- Video y Canvas -->
  <video id="input_video" autoplay playsinline class="absolute w-[1280px] h-[720px] rounded-xl object-cover"></video>
  <canvas id="output_canvas" class="absolute w-[1280px] h-[720px] rounded-xl object-cover"></canvas>

  <!-- Panel superior -->
  <div class="absolute top-5 left-5 bg-gray-800/90 p-4 rounded-xl shadow-lg w-72">
    <div class="flex justify-between items-center mb-2">
      <span>⏱️ Estado:</span>
      <span id="estado" class="font-semibold">Detectando...</span>
    </div>
    <div class="w-full h-2 bg-gray-700 rounded-full overflow-hidden mb-2">
      <div id="barra" class="h-full bg-cyan-400 transition-all duration-150" style="width:0%"></div>
    </div>
    <div class="flex justify-between items-center">
      <span>🕒 Temporizador:</span>
      <span id="timerValue" class="font-semibold">0.0 s</span>
    </div>
  </div>

  <!-- Chat lateral -->
  <div class="absolute right-5 top-1/2 transform -translate-y-1/2 w-80 h-96 bg-gray-800/90 p-4 rounded-xl shadow-lg overflow-y-auto">
    <h3 class="text-lg font-bold mb-2">🪞 Chat de Interpretación</h3>
    <div id="chat" class="text-sm space-y-1 overflow-y-auto h-80"></div>
  </div>

<!-- Controles modernos con Heroicons SVG -->
<div class="absolute bottom-5 flex space-x-6 justify-center w-full">
  <button id="btnCam" class="flex items-center justify-center w-20 h-20 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white rounded-2xl shadow-xl transition transform hover:scale-110">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
      <path d="M4 5a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2h-4.586l-1.707-1.707A1 1 0 0014.586 3H9.414a1 1 0 00-.707.293L7 5H4zM12 9a4 4 0 110 8 4 4 0 010-8z"/>
    </svg>
  </button>
  <button id="btnPause" class="flex items-center justify-center w-20 h-20 bg-yellow-500 hover:bg-yellow-400 active:bg-yellow-600 text-white rounded-2xl shadow-xl transition transform hover:scale-110">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
      <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
    </svg>
  </button>
  <button id="btnReset" class="flex items-center justify-center w-20 h-20 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-2xl shadow-xl transition transform hover:scale-110">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
    </svg>
  </button>
  <button id="btnStop" class="flex items-center justify-center w-20 h-20 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white rounded-2xl shadow-xl transition transform hover:scale-110">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
      <path d="M6 6h12v12H6z"/>
    </svg>
  </button>
</div>


<!--VENTANA DE CONFIRMACIÓN -->
<div id="feedbackModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-gray-800 rounded-xl p-6 w-96 text-center shadow-2xl">
    <h2 class="text-lg font-semibold mb-4">
      ¿El resultado fue el esperado?
    </h2>

    <div class="flex justify-center gap-4">
      <button id="btnYes" class="px-6 py-2 bg-green-600 hover:bg-green-500 rounded-lg">
        Sí
      </button>
      <button id="btnNo" class="px-6 py-2 bg-red-600 hover:bg-red-500 rounded-lg">
        No
      </button>
    </div>
  </div>
</div>


<script>
  // ==============================
  // INICIALIZACIÓN DE CÁMARA Y MEDIA PIPE
  // ==============================
  const CONFIG = {
    RES_W: 1280,
    RES_H: 720,
    PAUSA_LETRA: 1.5,
    PAUSA_PALABRA: 3.0,
    PAUSA_ORACION: 3.5,
    PAUSA_TEMPORIZADOR: 5.0,
    CONF_THRESH: 0.85,

    BUFFER_SIZE: 5,
    MIN_CONFIDENCE: 0.8,      //LOW_CONF_PAUSE
    COOLDOWN_LETRA_MS: 1200, 
  };

const video = document.getElementById('input_video');
const canvas = document.getElementById('output_canvas');
const ctx = canvas.getContext('2d');

let cameraInstance = null;
let feedbackActivo = false; //bloquea reconocimiento cuando es true


async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: CONFIG.RES_W, height: CONFIG.RES_H, facingMode: 'user' },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  return stream;
}






const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: CONFIG.CONF_THRESH,
  minTrackingConfidence: CONFIG.CONF_THRESH
});

hands.onResults(onResults);  // Esta función la definimos aparte más abajo

video.addEventListener('loadeddata', () => {
  canvas.width = CONFIG.RES_W;
  canvas.height = CONFIG.RES_H;
});

setupCamera().then(() => {
  cameraInstance = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: CONFIG.RES_W,
    height: CONFIG.RES_H
  });
  cameraInstance.start();
});


// ==============================
// VARIABLES DE ESTADO
// ==============================
const estado = document.getElementById('estado');
const barra = document.getElementById('barra');
const timerValue = document.getElementById('timerValue');
const chat = document.getElementById('chat');

let lastGestureTime = Date.now();
let lastDetected = false;
let currentTimer = 0;
let cameraOn = true;
let paused = false;

// --- Buffer para letras ---
let bufferLetras = [];
let ultimaLetra = null;
let cooldownLetraHasta = 0;
let textoOracion = "";

// Tiempos y control de envío de oración (como en el código largo)
let lastLetterTime = Date.now();    // última letra aceptada
let lastActivityTime = Date.now();  // última actividad "real" (letra aceptada)
let oracionEnviada = false;         // para no repetir la misma oración
let interpretationActive = true;    // por ahora siempre true


let manoSeSolto = true;


// ==============================
// FUNCIONES DE DETECCIÓN Y PROCESAMIENTO
// ==============================
function onResults(results) {
  if (paused || feedbackActivo) return;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  const now = Date.now();

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    manoActiva = true;
    const landmarks = results.multiHandLandmarks[0];

    // Dibujar mano
    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
    drawLandmarks(ctx, landmarks, { color: '#FF0000', lineWidth: 3, radius: 5 });

    // Enviar datos a API
    if (now >= cooldownLetraHasta) {
      enviarLandmarksAPI(landmarks);
      estado.textContent = '✋ Mano detectada';
    } else {
      estado.textContent = '⏸️ Esperando siguiente letra...';
    }

    lastGestureTime = now;
    lastDetected = true;
    currentTimer = 0;
  } else {
    manoActiva = false;
    manoSeSolto = true;
    manejarTemporizador(now);
  }

  ctx.restore();
}

// ==============================
// FUNCION AUXILIAR PARA ENVIAR LANDMARKS A API
// ==============================

// Variables de control de aceptación real
let lastAcceptedLetter = null;
let lastAcceptedTime = 0; // ms

let gestureLocked = false;
let lastStableGesture = null;


function enviarLandmarksAPI(landmarks) {
  // Convertimos los landmarks a un formato simple compatible con tu API
  const payload = {
    landmarks: landmarks.map(p => ({ x: 1 - p.x, y: p.y, z: p.z }))
  };

  fetch("http://127.0.0.1:8001/api/test/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(res => res.json())
    .then(data => {
      if (data.letter && data.confidence >= CONFIG.MIN_CONFIDENCE) {
        // Actualizar buffer y detectar la letra más frecuente
        bufferLetras.push(data.letter);
        if (bufferLetras.length > CONFIG.BUFFER_SIZE) bufferLetras.shift();

        const counts = {};
        bufferLetras.forEach(l => counts[l] = (counts[l] || 0) + 1);
        const mostFrequent = Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b);
        const frecuencia = counts[mostFrequent] / CONFIG.BUFFER_SIZE;
        const ahora = Date.now();

        // Condición para aceptar la letra:
        // - aceptar si la frecuencia es suficiente (>= 75%)
        // - y además (la letra es distinta a la última aceptada) o (es la misma pero ya pasó la pausa)
        const tiempoDesdeUltimaAceptada = ahora - lastAcceptedTime;
        const pausaLetraMs = CONFIG.PAUSA_LETRA * 1000;

        if (frecuencia >= 0.75) {
          const esMisma = (mostFrequent === lastAcceptedLetter);
          const puedeRepetir = esMisma && (tiempoDesdeUltimaAceptada >= pausaLetraMs);
          const esNueva = !esMisma;

          if (esNueva || (esMisma && manoSeSolto)) {
            // Aceptamos la letra
            lastAcceptedLetter = mostFrequent;
            lastAcceptedTime = ahora;

            // Actualizamos la oración y tiempos
            textoOracion += mostFrequent;
            console.log("➡️ textoOracion tras letra:", textoOracion);
            manoSeSolto = false;
            lastLetterTime = ahora;
            lastActivityTime = ahora;
            oracionEnviada = false;

            // Cooldown para evitar llamadas API demasiado seguidas
            cooldownLetraHasta = ahora + CONFIG.COOLDOWN_LETRA_MS;

            // Limpiar buffer para evitar repeticiones inmediatas por ruido
            bufferLetras = [];

            // Mostrar en el chat
            chat.innerHTML += `<div>🔤 Letra confirmada: ${mostFrequent} (Conf: ${Math.round(
              data.confidence * 100
            )}%)</div>`;
            chat.scrollTop = chat.scrollHeight;
          } else {
            // No se acepta (es la misma letra y aún no pasó la pausa)
            // Puedes descomentar la línea siguiente para debug
            // console.log("❌ Rechazada por ser repetición rápida:", mostFrequent);
          }
        }
      }

      if (data.error) console.error("Error API:", data.error);
    })
    .catch(err => console.error("Error fetch:", err));
}

// ==============================
// ENVIAR ORACIÓN A GEMINI (FastAPI /api/correct/)
// ==============================
function enviarOracionAGemini(oracion) {
  if (!oracion || !oracion.trim()) return;

  fetch("http://127.0.0.1:8001/api/correct/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sentence: oracion })
  })
    .then(res => res.json())
    .then(data => {
      if (data.corrected) {
        // Mostrar oración corregida en el chat
        chat.innerHTML += `<div>✏️ Oración corregida: ${data.corrected}</div>`;
        chat.scrollTop = chat.scrollHeight;
        
        feedbackActivo = true;
        paused = true; // extra seguridad
        feedbackModal.classList.remove("hidden");
      } else if (data.error) {
        console.error("Error API corrección:", data.error);
      } else {
        console.warn("Respuesta rara de /api/correct/:", data);
      }
    })
    .catch(err => console.error("Error fetch /api/correct/:", err));
}


        

// ==============================
// FUNCION AUXILIAR PARA MANEJAR TEMPORIZADOR Y ESTADO
// ==============================
function manejarTemporizador(now) {
  if (!lastDetected) return; // aún no hemos visto mano/letra en esta sesión

  // Tiempos en segundos desde la última letra y desde la última actividad real
  const timeSinceLastLetter = (now - lastLetterTime) / 1000.0;
  const timeSinceLastActivity = (now - lastActivityTime) / 1000.0;

  // Usamos el tiempo desde la última actividad para el temporizador principal
  currentTimer = timeSinceLastActivity;
  timerValue.textContent = currentTimer.toFixed(1);

  // 1) Detectar fin de oración y enviarla al chat (como en el código largo)
  if (
    interpretationActive &&
    !oracionEnviada &&                 // evitar duplicados
    textoOracion.trim().length > 0 &&  // solo si hay letras acumuladas
    timeSinceLastActivity >= CONFIG.PAUSA_TEMPORIZADOR
  ) {
    estado.textContent = '✅ Enviando oración';

    const oracion = textoOracion.trim();
    chat.innerHTML += `<div>📝 Oración: ${oracion}</div>`;
    chat.scrollTop = chat.scrollHeight;

      // 🔹 NUEVO: mandar la oración a Gemini para corregir

    enviarOracionAGemini(oracion);


    console.log("🚀 Oración enviada:", oracion);

    // Marcar que ya se envió
    oracionEnviada = true;

    // Limpiar para empezar una nueva oración
    textoOracion = "";
    bufferLetras = [];
    ultimaLetraMostrada = null;
    tiempoUltimaLetra = 0;
    cooldownLetraHasta = 0;

    // Reiniciar contadores de tiempo
    lastActivityTime = now;
    lastLetterTime = now;
    lastDetected = false;

    return; // ya manejamos este caso
  }

  // 2) Actualizar mensaje de estado según los tiempos
  if (timeSinceLastActivity >= CONFIG.PAUSA_TEMPORIZADOR) {
    estado.textContent = '🗣️ Fin de oración';
  } else if (timeSinceLastLetter >= CONFIG.PAUSA_PALABRA && textoOracion.length > 0) {
    estado.textContent = '💬 Fin de palabra';
  } else if (timeSinceLastLetter >= CONFIG.PAUSA_LETRA && textoOracion.length > 0) {
    estado.textContent = '🔤 Fin de letra';
  } else {
    estado.textContent = '⏱️ Esperando siguiente gesto...';
  }

  // 3) Progreso barra
  const progreso = Math.min(
    (timeSinceLastActivity / CONFIG.PAUSA_TEMPORIZADOR) * 100,
    100
  );
  barra.style.width = `${progreso}%`;
}


// ==============================
// EVENTOS DE BOTONES
// ==============================

// Encender/Apagar cámara
document.getElementById('btnCam').addEventListener('click', async () => {
  if (cameraOn) {
    const tracks = video.srcObject.getTracks();
    tracks.forEach(t => t.stop());
    estado.textContent = '📷 Cámara apagada';
    cameraOn = false;
  } else {
    await setupCamera();
    estado.textContent = '📸 Cámara encendida';
    cameraOn = true;
  }
});

// Pausar/Reanudar detección
// Pausar/Reanudar detección con cambio de icono
const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', () => {
  paused = !paused;
  if (paused) {
    estado.textContent = '⏸️ Pausado';
    btnPause.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
        <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
      </svg>
    `; // Icono de pausa
  } else {
    estado.textContent = '▶️ Reanudado';
    btnPause.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    `; // Icono de play
  }
});


// Reiniciar temporizador y chat
  document.getElementById('btnReset').addEventListener('click', () => {
    lastDetected = false;
    currentTimer = 0;
    barra.style.width = '0%';
    estado.textContent = '🔄 Reiniciado';
    timerValue.textContent = '0.0';

    bufferLetras = [];
    ultimaLetra = null;
    ultimaLetraMostrada = null;
    tiempoUltimaLetra = 0;
    textoOracion = "";
    cooldownLetraHasta = 0;
    lastLetterTime = Date.now();
    lastActivityTime = Date.now();
    oracionEnviada = false;

    chat.innerHTML = '';
  });

// Detener únicamente la detección
document.getElementById('btnStop').addEventListener('click', () => {
  paused = true; // Solo pausa la detección
  estado.textContent = '🛑 Reconocimiento detenido';
});



// ==============================
// INICIAR CÁMARA AUTOMÁTICAMENTE AL CARGAR
// ==============================
async function iniciarCamara() {
  await setupCamera(); // Prepara el video
  cameraInstance = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: CONFIG.RES_W,
    height: CONFIG.RES_H
  });
  cameraInstance.start();
  cameraOn = true;
  estado.textContent = '📸 Cámara encendida';
}

// Llamamos al cargar la página
iniciarCamara();



//Botones de confirmación
const feedbackModal = document.getElementById("feedbackModal");
const btnYes = document.getElementById("btnYes");
const btnNo = document.getElementById("btnNo");

let respuestaUsuario = null;

btnYes.addEventListener("click", () => {
  respuestaUsuario = true;
  console.log("Respuesta usuario: SÍ");
  feedbackActivo = false; 
  paused = false;   
  feedbackModal.classList.add("hidden");
});

btnNo.addEventListener("click", () => {
  respuestaUsuario = false;
  console.log("Respuesta usuario: NO");
  feedbackActivo = false; 
  paused = false;   
  feedbackModal.classList.add("hidden");
});





</script>

</body>
</html>
